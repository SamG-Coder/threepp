<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Native cubes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #061326; }
    #label { position: fixed; z-index: 2; left: 14px; top: 12px; color: white; font: 13px system-ui; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
<div id="label">The same page runs in Web and Native modes</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.184.0/build/three.module.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x061326);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.2, 6);
  camera.lookAt(0, 0, 0);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const colors = [0x2f81f7, 0x35c48d, 0xff9d3d];
  const cubes = colors.map((color, index) => {
    const cube = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
    cube.position.x = (index - 1) * 1.55;
    scene.add(cube);
    return cube;
  });
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 2));

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop((time) => {
    cubes.forEach((cube, i) => {
      cube.rotation.x = time * 0.00045 + i * 0.25;
      cube.rotation.y = time * 0.0007 + i * 0.4;
    });
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
